# sprint-W22-be-sync/B-3 — Prometheus scrape config for study-note self-host stack.
# study-note-api 의 /api/metrics 를 15s 마다 pull. retention = 7d (storage tier 작음).

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    monitor: "study-note"
    env: "production"

scrape_configs:
  - job_name: "study-note-api"
    scheme: https
    metrics_path: /api/metrics
    # sprint-W22-sprint-24 / AC14 — /api/metrics 가 fail-closed 토큰 게이트.
    # `Authorization: Bearer <token>` 헤더로 호출. token = ACA secret 의 file
    # 마운트 (`metrics-internal-token` → /etc/prometheus/metrics-token).
    # 동일 token 값이 study-note-api 의 METRICS_INTERNAL_TOKEN env 와 일치해야 함.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets:
          # ACA external ingress FQDN + HTTPS. internal-to-external (Prometheus
          # internal → study-note-api external) 시 ACA 가 internal alias resolve
          # 안 함 — explicit external FQDN 으로 호출.
          # 같은 env 안 internal-to-internal 이면 port 미명시 alias 사용 가능
          # (Grafana → Prometheus 패턴), 단 cross-ingress 는 FQDN 필요.
          - "study-note-api.bluesea-474361c6.koreacentral.azurecontainerapps.io"
    relabel_configs:
      - target_label: service
        replacement: "study-note-api"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
