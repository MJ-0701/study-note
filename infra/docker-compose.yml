# SECURITY WARNING: For LOCAL DEVELOPMENT ONLY. Never use these credentials in production.
services:
  db-service:
    image: mysql:8.0
    container_name: db-service
    restart: always
    environment:
      MYSQL_DATABASE: study_note
      MYSQL_USER: study_note
      MYSQL_PASSWORD: study_note
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - study-note-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  s3-service:
    image: localstack/localstack
    container_name: s3-service
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
    volumes:
      - "./localstack:/var/lib/localstack"
      - "./localstack/init:/etc/localstack/init/ready.d"
    networks:
      - study-note-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  be-service:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: be-service
    depends_on:
      db-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=mysql://study_note:study_note@db-service:3306/study_note
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - SESSION_TOKEN_PEPPER=${SESSION_TOKEN_PEPPER:-change-me-local-session-pepper}
      - STUDY_NOTE_DEV_USER_NAME=${STUDY_NOTE_DEV_USER_NAME:-Dev User}
      - STUDY_NOTE_DEV_STUDENT_NUMBER=${STUDY_NOTE_DEV_STUDENT_NUMBER:-20260001}
      - STUDY_NOTE_DEV_USER_EMAIL=${STUDY_NOTE_DEV_USER_EMAIL:-dev1@example.com}
      - STUDY_NOTE_SECOND_USER_NAME=${STUDY_NOTE_SECOND_USER_NAME:-Reviewer}
      - STUDY_NOTE_SECOND_STUDENT_NUMBER=${STUDY_NOTE_SECOND_STUDENT_NUMBER:-20260002}
      - STUDY_NOTE_SECOND_USER_EMAIL=${STUDY_NOTE_SECOND_USER_EMAIL:-reviewer@example.com}
    networks:
      - study-note-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  fe-service:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: fe-service
    depends_on:
      - be-service
    ports:
      - "127.0.0.1:80:80"
    networks:
      - study-note-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  study-note-net:
    driver: bridge

volumes:
  mysql-data:
