# SECURITY WARNING: For LOCAL DEVELOPMENT ONLY. Never use these credentials in production.
name: study-note

services:
  db-service:
    image: mysql:8.0
    container_name: db-service
    restart: always
    environment:
      MYSQL_DATABASE: study_note
      MYSQL_USER: study_note
      MYSQL_PASSWORD: study_note
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - study-note-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  s3-service:
    # Pin to 3.x community image — versions ≥ 4.0 require LOCALSTACK_AUTH_TOKEN.
    image: localstack/localstack:3.8.1
    container_name: s3-service
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
    volumes:
      - "./localstack:/var/lib/localstack"
      - "./localstack/init:/etc/localstack/init/ready.d"
    networks:
      - study-note-net
    healthcheck:
      # localstack 3.x (Debian-based) has curl; use health endpoint for reliable ready check
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  be-service:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: be-service
    depends_on:
      db-service:
        condition: service_healthy
      s3-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      - PORT=3010
      - HOST=0.0.0.0
      - DATABASE_URL=mysql://study_note:study_note@db-service:3306/study_note
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://s3-service:4566}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-study-note-dev}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-test}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-test}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - SESSION_TOKEN_PEPPER=${SESSION_TOKEN_PEPPER:-change-me-local-session-pepper}
      - STUDY_NOTE_DEV_USER_NAME=${STUDY_NOTE_DEV_USER_NAME:-Dev User}
      - STUDY_NOTE_DEV_STUDENT_NUMBER=${STUDY_NOTE_DEV_STUDENT_NUMBER:-20260001}
      - STUDY_NOTE_DEV_USER_EMAIL=${STUDY_NOTE_DEV_USER_EMAIL:-dev1@example.com}
      - STUDY_NOTE_SECOND_USER_NAME=${STUDY_NOTE_SECOND_USER_NAME:-Reviewer}
      - STUDY_NOTE_SECOND_STUDENT_NUMBER=${STUDY_NOTE_SECOND_STUDENT_NUMBER:-20260002}
      - STUDY_NOTE_SECOND_USER_EMAIL=${STUDY_NOTE_SECOND_USER_EMAIL:-reviewer@example.com}
      # Seed toggle: dev default true, prod must set STUDY_NOTE_RUN_SEED=false explicitly
      - STUDY_NOTE_RUN_SEED=${STUDY_NOTE_RUN_SEED:-true}
    networks:
      - study-note-net
    restart: on-failure:3
    healthcheck:
      # Use node http.get — avoids curl/wget IPv6 ambiguity in alpine containers
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      # entrypoint: up to 60s DB wait + migrate + seed; allow 90s before health probes begin
      start_period: 90s

  fe-service:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: fe-service
    depends_on:
      - be-service
    ports:
      - "127.0.0.1:80:80"
    networks:
      - study-note-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  study-note-net:
    driver: bridge

volumes:
  mysql-data:
