# sprint-W22-be-sync/B-4 — Grafana data source provisioning.
# Image start 시 자동 등록. UI 에서 추가 없음.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # ACA same-env service discovery — internal ingress 는 port 80 만 노출
    # (target port 9090 으로 자동 mapping). port 9090 명시 시 connection refused.
    url: http://study-note-prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
