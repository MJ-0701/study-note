# Solon SFS — BE Release Pipeline (Azure Container Apps)
#
# 트리거: `be-v*` 태그 푸시 시에만 production 배포
# 예: git tag be-v0.1.0 && git push origin be-v0.1.0
#
# 흐름:
#   1. Checkout
#   2. Build Docker image (apps/api/Dockerfile, repo root context)
#   3. Push to GitHub Container Registry (ghcr.io/<owner>/study-note-api)
#   4. Azure login (Service Principal secret-based)
#   5. Container App 이미지 업데이트 → 새 revision 자동 생성
#
# Container App: study-note-api (study-note-be-rg, Korea Central)
# Container App 의 기존 secrets (database-url, session-token-pepper) 와
# env vars 는 이미지 업데이트 시 유지된다.
#
# 프론트엔드는 별도 워크플로우 (fe-release.yml, `fe-v*` 태그) 로 분리 배포.

name: BE Release (Azure Container Apps)

on:
  push:
    tags:
      - 'be-v*'

# 같은 태그/ref 중복 실행 방지
concurrency:
  group: be-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/study-note-api
  RESOURCE_GROUP: study-note-be-rg
  CONTAINER_APP_NAME: study-note-api

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write   # ghcr push 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve tag → version + image tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#be-v}"
          REPO_OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_BASE="${{ env.REGISTRY }}/${REPO_OWNER_LOWER}/study-note-api"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_BASE}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_BASE}:latest" >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        # 빌드 컨텍스트는 repo root (Dockerfile 이 monorepo root 의 packages/* 와 apps/api 를 모두 참조)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_latest }}
          # GitHub Actions cache 로 다음 빌드 가속
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Azure login (Service Principal)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Update Container App with new image
        # --image 만 갱신: 기존 secrets (database-url, session-token-pepper) 와
        # env vars 는 그대로 유지되고 새 revision 이 자동 생성된다.
        # DEPLOY_TAG/SHA 는 운영 디버깅용 — 어떤 태그/커밋이 배포됐는지 확인 가능.
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.image_tag }}" \
            --set-env-vars \
              "DEPLOY_TAG=${{ github.ref_name }}" \
              "DEPLOY_SHA=${{ github.sha }}"

      - name: Show new revision info
        run: |
          az containerapp revision list \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[?properties.active].{Name:name, CreatedTime:properties.createdTime, TrafficWeight:properties.trafficWeight, ProvisioningState:properties.provisioningState}" \
            --output table

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "### BE Release \`${{ github.ref_name }}\`"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| Tag | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Image | \`${{ steps.meta.outputs.image_tag }}\` |"
            echo "| Container App | \`${{ env.CONTAINER_APP_NAME }}\` |"
            echo "| Resource Group | \`${{ env.RESOURCE_GROUP }}\` |"
            echo "| API URL (기본) | https://study-note-api.bluesea-474361c6.koreacentral.azurecontainerapps.io |"
            echo "| API URL (커스텀) | https://study-note.api.910701.xyz |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
