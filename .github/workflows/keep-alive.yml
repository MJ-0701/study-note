# Keep Alive — Azure Container App 콜드스타트 회피용 health ping
#
# 배경:
#   - 백엔드는 Azure Container Apps 에 `min-replicas = 0` 으로 운영된다.
#   - idle 시 컨테이너가 0 으로 scale 되어 다음 요청에서 cold start (수십 초)
#     가 발생하고, 프런트에서는 "서버를 깨우는 중" UX 가 노출된다.
#   - min-replicas = 1 은 비용 사유로 채택하지 않기로 결정했다
#     (docs/solon/cold-start-ux/20260521/report.md §3).
#
# 동작:
#   - 5 분마다 `/api/health` 를 한 번 ping 해서 컨테이너 idle 카운터를 리셋한다.
#   - HTTP 200 이면 성공, 그 외엔 워크플로우 실패 → Actions 탭에서 알람.
#
# 한계 (의도된 trade-off):
#   - GitHub Actions cron 은 최소 5 분 단위이며, 실제로는 5~15 분 지연될 수
#     있다. ACA scale-to-zero idle window 가 짧으면 ping 사이에 컨테이너가
#     내려갈 수 있고, 그 경우 첫 사용자가 한 번은 cold start 를 본다.
#   - 엄격한 SLO 가 필요해지면 외부 uptime 서비스 (cron-job.org, UptimeRobot
#     무료 plan, 1 분 단위) 로 옮기는 게 좋다.

name: Keep Alive (Health Ping)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health
        run: |
          set -euo pipefail
          URL="https://study-note.910701.xyz/api/health"
          echo "GET ${URL}"
          curl -fsS --max-time 30 "${URL}" \
            -w "\nstatus:%{http_code} time:%{time_total}s\n"
