# sprint-W22-be-sync/B — Prometheus + Grafana image build + push.
# tag = `infra-v*` 시 trigger. ghcr.io 에 두 image push.
# ACA Container App update 는 별 workflow (또는 az CLI manual) — 본 workflow
# 는 image build 만 책임.

name: Infra Release (Prometheus + Grafana)

on:
  push:
    tags:
      - "infra-v*"
  workflow_dispatch: {}

# 다음 infra-v* tag push 시 이전 run 자동 cancel — 옛 image 가 latest 로
# overwrite 되는 회귀 차단.
concurrency:
  group: infra-release
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-prometheus:
    name: Build & Push Prometheus
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: owner
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push study-note-prometheus
        uses: docker/build-push-action@v5
        with:
          context: ./infra/prometheus
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lc }}/study-note-prometheus:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lc }}/study-note-prometheus:latest

  build-grafana:
    name: Build & Push Grafana
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: owner
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push study-note-grafana
        uses: docker/build-push-action@v5
        with:
          context: ./infra/grafana
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lc }}/study-note-grafana:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lc }}/study-note-grafana:latest
