<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Lecture note coverage flow</title>
  <desc id="desc">A compact flow from private professor PDF through required keywords, concept notes, and practice questions.</desc>
  <rect width="720" height="220" fill="#ffffff"/>
  <g fill="none" stroke="#eaeaea" stroke-width="1">
    <rect x="28" y="38" width="142" height="104" rx="8"/>
    <rect x="208" y="38" width="142" height="104" rx="8"/>
    <rect x="388" y="38" width="142" height="104" rx="8"/>
    <rect x="568" y="38" width="124" height="104" rx="8"/>
  </g>
  <g stroke="#3b6ef5" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M170 90h38"/>
    <path d="M350 90h38"/>
    <path d="M530 90h38"/>
  </g>
  <g fill="#eaf0ff" stroke="#3b6ef5" stroke-width="1">
    <circle cx="99" cy="72" r="18"/>
    <circle cx="279" cy="72" r="18"/>
    <circle cx="459" cy="72" r="18"/>
    <circle cx="630" cy="72" r="18"/>
